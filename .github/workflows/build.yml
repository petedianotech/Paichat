name: Build Release Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Environment Files
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Compute version from run number
        id: version
        run: |
          # Every workflow run gets a higher versionCode so the APK can update the installed app.
          # Base offset keeps codes above any previous manual builds (start at 10).
          VERSION_CODE=$((10 + ${{ github.run_number }}))
          VERSION_NAME="1.1.${{ github.run_number }}"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Building versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Decode release keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret KEYSTORE_BASE64 is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/my-upload-key.jks"
          ls -la "$GITHUB_WORKSPACE/my-upload-key.jks"
          # Export path for Gradle
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK (signed)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Locate and rename APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No release APK found"
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          OUT="PaiChat-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}-release.apk"
          cp "$APK" "$OUT"
          echo "apk_path=$OUT" >> $GITHUB_OUTPUT
          ls -lh "$OUT"
          # Optional: print signing cert fingerprint for verification
          if command -v keytool >/dev/null && command -v apksigner >/dev/null; then
            $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$OUT" || true
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PaiChat-Release-${{ env.VERSION_NAME }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
