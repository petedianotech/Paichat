name: Build Release Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Environment Files
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Compute version from run number
        id: version
        run: |
          VERSION_CODE=$((10 + ${{ github.run_number }}))
          VERSION_NAME="1.1.${{ github.run_number }}"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Building versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Decode release keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret KEYSTORE_BASE64 is empty or not set."
            echo "Add it at: Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD and KEY_PASSWORD secrets are required."
            exit 1
          fi
          ALIAS="${KEY_ALIAS:-upload}"
          # Strip whitespace/newlines that can break base64 when pasting into GitHub UI
          CLEAN_B64=$(echo "$KEYSTORE_BASE64" | tr -d '\n\r\t ')
          KEYSTORE_FILE="$GITHUB_WORKSPACE/my-upload-key.jks"
          echo "$CLEAN_B64" | base64 -d > "$KEYSTORE_FILE" 2>/tmp/b64.err || echo "$CLEAN_B64" | base64 --decode > "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Decoded keystore is empty. Check KEYSTORE_BASE64 secret."
            cat /tmp/b64.err 2>/dev/null || true
            exit 1
          fi
          ls -la "$KEYSTORE_FILE"
          # Validate keystore can be opened with provided passwords
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" -alias "$ALIAS" || {
            echo "ERROR: keytool cannot open keystore with STORE_PASSWORD / KEY_ALIAS=$ALIAS"
            echo "Verify secrets: KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS"
            exit 1
          }
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "Keystore OK (alias=$ALIAS)"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK (signed)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          set -e
          echo "KEYSTORE_PATH=$KEYSTORE_PATH"
          test -f "$KEYSTORE_PATH"
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Locate and rename APK
        id: apk
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "No release APK found"
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          OUT="PaiChat-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}-release.apk"
          cp "$APK" "$OUT"
          echo "apk_path=$OUT" >> $GITHUB_OUTPUT
          ls -lh "$OUT"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PaiChat-Release-${{ env.VERSION_NAME }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
